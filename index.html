    // 金額轉中文大寫
    const cnUpper = (amount) => {
      const n0 = Math.round(num(amount));
      if (n0 === 0) return "零元整";
      const d = ["零", "壹", "貳", "參", "肆", "伍", "陸", "柒", "捌", "玖"];
      const u = ["", "拾", "佰", "仟"];
      const big = ["", "萬", "億", "兆"];
      const seg4 = (s) => {
        let r = "", z = false;
        for (let i = 3; i >= 0; i--) {
          const v = Math.floor(s / Math.pow(10, i)) % 10;
          if (v === 0) { if (r) z = true; }
          else { if (z) { r += "零"; z = false; } r += d[v] + u[i]; }
        }
        return r;
      };
      const segs = []; let n = n0;
      while (n > 0) { segs.push(n % 10000); n = Math.floor(n / 10000); }
      let out = "", needZero = false;
      for (let gi = segs.length - 1; gi >= 0; gi--) {
        const seg = segs[gi];
        if (seg === 0) { needZero = out !== ""; continue; }
        if (out !== "" && (needZero || seg < 1000)) out += "零";
        out += seg4(seg) + big[gi];
        needZero = false;
      }
      return out + "元整";
    };

    // 報價單計算（營業稅 5%）
    const calcQuote = (items, discount) => {
      const subtotal = sum(items, it => num(it.price) * num(it.quantity));
      const totalCost = sum(items, it => num(it.cost) * num(it.quantity));
      const disc = Math.min(num(discount), subtotal);
      const taxable = subtotal - disc;
      const tax = Math.round(taxable * 0.05);
      return {
        subtotal, totalCost, discount: disc, taxable, tax, total: taxable + tax,
        grossProfit: taxable - totalCost,
        margin: taxable > 0 ? Math.round((taxable - totalCost) / taxable * 1000) / 10 : 0
      };
    };
    const calcPurchase = (items, withTax) => {
      const subtotal = sum(items, it => num(it.cost) * num(it.quantity));
      const tax = withTax ? Math.round(subtotal * 0.05) : 0;
      return { subtotal, tax, total: subtotal + tax };
    };

      const actual = material + labor + other;
      const profit = revenue - actual;

      return {

    /* ===================== Firebase 設定解析 ===================== */
    function parseFirebaseConfig(str) {
      let s = String(str || "").trim();
      const a = s.indexOf("{"), b = s.lastIndexOf("}");
      if (a < 0 || b < a) throw new Error("找不到 { } 設定內容");
      s = s.slice(a, b + 1);
      try { return JSON.parse(s); } catch (e) { /* 試著修正 JS 物件寫法 */ }
      const fixed = s
        .replace(/([{,]\s*)([A-Za-z_]\w*)\s*:/g, '$1"$2":')
        .replace(/'/g, '"')
        .replace(/,\s*}/g, "}");
      return JSON.parse(fixed);
    }

    /* ===================== 資料同步 Hook（本機 + Firebase） ===================== */
    const cloudError = err => window.dispatchEvent(new CustomEvent("cloud-error", { detail: (err && err.code) || "unknown" }));

    function useCloudList(name, initial, db) {
      const key = "erp_" + name;
      const [list, setList] = useState(() => loadLS(key, initial));
      const listRef = useRef(list);
      listRef.current = list;
      const seeded = useRef(false);

      useEffect(() => { try { localStorage.setItem(key, JSON.stringify(list)); } catch (e) { /* ignore */ } }, [list]);

      useEffect(() => {
        if (!db) return;
        seeded.current = false;
        const col = db.collection(name);
        const unsub = col.onSnapshot(snap => {
          if (snap.empty && !seeded.current && listRef.current.length > 0) {
            // 雲端是空的：把本機資料上傳
            const batch = db.batch();
            listRef.current.forEach((it, i) => batch.set(col.doc(it.id), clean({ ...it, createdAt: it.createdAt || (Date.now() - i) })));
            batch.commit().catch(cloudError);
          } else {
            setList(snap.docs.map(d => d.data()).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)));
          }
          seeded.current = true;
        }, cloudError);
        return unsub;
      }, [db]);

      const api = {
        add: item => {
          const it = { createdAt: Date.now(), ...item };
          setList(p => [it, ...p]);
          if (db) db.collection(name).doc(it.id).set(clean(it)).catch(cloudError);
          return it;
        },
        update: (id, patch) => {
          setList(p => p.map(x => x.id === id ? { ...x, ...patch } : x));
          if (db) db.collection(name).doc(id).set(clean(patch), { merge: true }).catch(cloudError);
        },
        remove: id => {
          setList(p => p.filter(x => x.id !== id));
          if (db) db.collection(name).doc(id).delete().catch(cloudError);
        },
        replaceAll: async items => {
          const next = items.map((it, i) => ({ ...it, id: it.id || uid("i"), createdAt: it.createdAt || (Date.now() - i) }));
          const old = listRef.current;
          setList(next);
          if (db) {
            const col = db.collection(name);
            const ops = [
              ...old.filter(o => !next.some(n => n.id === o.id)).map(o => ({ del: o.id })),
              ...next.map(n => ({ set: n }))
            ];
            for (let i = 0; i < ops.length; i += 400) {
              const b = db.batch();
              ops.slice(i, i + 400).forEach(op => op.del ? b.delete(col.doc(op.del)) : b.set(col.doc(op.set.id), clean(op.set)));
              await b.commit().catch(cloudError);
            }
          }
        }
      };
      return [list, api];
    }

    function useCloudDoc(name, initial, db) {

      const [val, setVal] = useState(() => ({ ...initial, ...(loadLS(key, {}) || {}) }));

        const docRef = db.collection("settings").doc(name);

          if (snap.exists) setVal({ ...initial, ...snap.data() });
          else docRef.set(clean(ref.current)).catch(cloudError);
        }, cloudError);
        return unsub;
      }, [db]);
      const save = next => {
        setVal(next);
        if (db) db.collection("settings").doc(name).set(clean(next)).catch(cloudError);
      };
      return [val, save];
    }

      const monthTx = D.transactions.filter(t => monthOf(t.date) === cur);
      const inc = sum(monthTx.filter(t => t.type === "income"), t => t.amount);
      const exp = sum(monthTx.filter(t => t.type === "expense"), t => t.amount);
      const withSt = rows => rows.map(r => ({ ...r, st: balanceStatus(r.total, r.paid, r.due) })).filter(r => r.st.balance > 0);
      const ar = withSt(arRows(D));
      const ap = withSt(apRows(D));
      const arBal = sum(ar, r => r.st.balance), apBal = sum(ap, r => r.st.balance);

        m,
        inc: sum(D.transactions.filter(t => t.type === "income" && monthOf(t.date) === m), t => t.amount),
        exp: sum(D.transactions.filter(t => t.type === "expense" && monthOf(t.date) === m), t => t.amount)

            <Stat label="在職員工" value={`${D.employees.filter(e => e.active !== false).length} 人`} tone="slate" onClick={() => go("employees")} />
          </div>

              {months.map(x => (

                  <div className="flex items-end justify-center gap-1 h-28">
                    <div className="w-1/3 bg-emerald-500 rounded-t" style={{ height: `${Math.max(x.inc ? 3 : 0, x.inc / max * 100)}%` }} title={`收入 ${money(x.inc)}`}></div>
                    <div className="w-1/3 bg-rose-400 rounded-t" style={{ height: `${Math.max(x.exp ? 3 : 0, x.exp / max * 100)}%` }} title={`支出 ${money(x.exp)}`}></div>

    /* ===================== 報價單 ===================== */
    function Quotations({ onPreview }) {
      const D = useData();
      const A = D.api.quotations;
      const [edit, setEdit] = useState(null);
      const [kw, setKw] = useState("");
      const custName = id => (D.customers.find(c => c.id === id) || {}).name || "-";
      const rows = D.quotations.filter(q => !kw || [q.no, q.projectName, custName(q.customerId)].join(" ").toLowerCase().includes(kw.toLowerCase()));
      const save = data => {
        if (data.id) A.update(data.id, data);
        else A.add({ ...data, id: uid("q"), no: nextNo("QUO", D.quotations), receipts: [] });
        setEdit(null);
      };
      const del = q => {
        const rec = receiptsOf(q, D.transactions);
        const linked = D.purchases.some(p => p.projectId === q.id) || D.timesheets.some(t => t.projectId === q.id);
        const msg = `確定刪除報價單「${q.no}」？`
          + (rec.length ? `\n其 ${rec.length} 筆收款紀錄（含財務收支）會一併刪除。` : "")
          + (linked ? "\n注意：已有採購單或工時連結此工程，刪除後這些紀錄會變成「未歸屬工程」。" : "");
        if (!confirm(msg)) return;
        rec.forEach(r => r.txId && D.api.transactions.remove(r.txId));
        A.remove(q.id);
      };
      const statusCls = s => s === "已成交" ? "bg-emerald-100 text-emerald-800" : s === "待回覆" ? "bg-amber-100 text-amber-800" : "bg-slate-200 text-slate-600";
      const columns = [
        { label: "單號", render: q => <span className="font-mono font-bold text-blue-600">{q.no}</span> },
        { label: "工程名稱", render: q => <span className="font-bold text-slate-900">{q.projectName}</span> },

        { label: "報價狀態", render: q => <Badge cls={statusCls(q.status)}>{q.status || "已成交"}</Badge> },
        { label: "進度", render: q => <span className="text-xs font-semibold text-blue-700">{q.projectStatus}</span> },
        { label: "總金額（含稅）", align: "right", render: q => <b>{money(q.total)}</b> },
        {
          label: "操作", align: "center", actions: true, render: q => (
            <div className="flex flex-wrap gap-2 justify-center">
              <ActBtn onClick={() => onPreview(q.id)}>預覽列印</ActBtn>
              <ActBtn tone="slate" onClick={() => setEdit(q)}>編輯</ActBtn>
              <ActBtn tone="rose" onClick={() => del(q)}>刪除</ActBtn>
            </div>
          )
        }
      ];
      return (
        <div className="space-y-4 max-w-6xl">
          <PageHeader title="工程報價單" subtitle="開立、編輯並列印報價單">
            <SearchBox value={kw} onChange={setKw} placeholder="搜尋單號 / 工程 / 業主" />
            <button className={btnPrimary} onClick={() => setEdit("new")}><Icon name="plus" className="w-4 h-4" /> 開立新報價單</button>
          </PageHeader>
          <DataList columns={columns} rows={rows} empty="尚無報價單，點右上角「開立新報價單」開始" />
          {edit && <QuotationForm initial={edit === "new" ? {} : edit} onSave={save} onClose={() => setEdit(null)} />}
        </div>
      );
    }

    /* ===================== 工程專案成本 ===================== */
    function Projects() {
      const D = useData();
      const [detail, setDetail] = useState(null);
      const deals = D.quotations.filter(q => q.status === "已成交");
      const rows = deals.map(q => ({ id: q.id, q, st: projectStats(q, D) }));
      const totRev = sum(rows, r => r.st.revenue), totAct = sum(rows, r => r.st.actual), totProfit = totRev - totAct;
      const custName = id => (D.customers.find(c => c.id === id) || {}).name || "-";
      const marginCls = m => m >= 20 ? "text-emerald-600" : m >= 0 ? "text-amber-600" : "text-rose-600";
      const columns = [
        { label: "工程", render: r => <div><div className="font-bold text-slate-900">{r.q.projectName}</div><div className="text-xs text-slate-500">{r.q.no}　{custName(r.q.customerId)}</div></div> },
        {
          label: "進度", render: r => (
            <select className="border border-slate-300 rounded-md px-2 py-1 text-xs bg-white" value={r.q.projectStatus} onChange={e => D.api.quotations.update(r.q.id, { projectStatus: e.target.value })}>
              <option value="施工中">施工中</option><option value="預計施作">預計施作</option><option value="已完工">已完工</option>
            </select>
          )
        },
        { label: "合約額（未稅）", align: "right", render: r => money(r.st.revenue) },
        { label: "預估成本", align: "right", render: r => <span className="text-slate-500">{money(r.st.est)}</span> },
        { label: "實際成本", align: "right", render: r => <b>{money(r.st.actual)}</b> },
        { label: "實際毛利", align: "right", render: r => <b className={marginCls(r.st.margin)}>{money(r.st.profit)}</b> },
        { label: "毛利率", align: "right", render: r => <b className={marginCls(r.st.margin)}>{r.st.margin.toFixed(1)}%</b> },
        { label: "收款進度", align: "right", render: r => `${Math.min(100, Math.round(r.st.received / Math.max(1, num(r.q.total)) * 100))}%` },
        { label: "操作", align: "center", actions: true, render: r => <ActBtn onClick={() => setDetail(r.id)}>成本明細</ActBtn> }
      ];
      return (
        <div className="space-y-4 max-w-6xl">
          <PageHeader title="工程專案成本" subtitle="實際成本 = 歸屬該工程的採購（未稅）+ 工時人工 + 其他支出" />
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
            <Stat label="合約總額（未稅）" value={money(totRev)} tone="blue" />
            <Stat label="實際成本" value={money(totAct)} tone="amber" />
            <Stat label="實際毛利" value={money(totProfit)} tone={totProfit >= 0 ? "emerald" : "rose"} />
            <Stat label="整體毛利率" value={`${totRev > 0 ? (totProfit / totRev * 100).toFixed(1) : "0.0"}%`} tone="slate" />
          </div>
          <DataList columns={columns} rows={rows} empty="尚無已成交工程。到「工程報價單」把報價狀態設為「已成交」即可顯示。" />
          {detail && <ProjectDetail qid={detail} onClose={() => setDetail(null)} />}
        </div>
      );
    }

    function ProjectDetail({ qid, onClose }) {
      const D = useData();
      const q = D.quotations.find(x => x.id === qid);
      if (!q) return null;
      const st = projectStats(q, D);
      const empName = id => (D.employees.find(e => e.id === id) || {}).name || "（已刪除）";
      const supName = id => (D.suppliers.find(s => s.id === id) || {}).name || "-";
      const Row = ({ k, v, bold }) => <div className={`flex justify-between gap-3 text-sm ${bold ? "font-bold border-t pt-1" : ""}`}><span className="text-slate-600">{k}</span><span>{v}</span></div>;
      return (
        <Modal title={`成本明細 - ${q.projectName}`} size="max-w-2xl" onClose={onClose} footer={<button className={btnGhost} onClick={onClose}>關閉</button>}>
          <div className="space-y-1 bg-slate-50 rounded-lg p-3">
            <Row k="合約額（未稅）" v={money(st.revenue)} />
            <Row k="預估成本（報價時）" v={money(st.est)} />
            <Row k="實際材料採購（未稅）" v={money(st.material)} />
            <Row k="實際人工（工時）" v={money(st.labor)} />
            <Row k="其他直接支出" v={money(st.other)} />
            <Row k="實際成本合計" v={money(st.actual)} bold />
            <Row k="實際毛利" v={<b className={st.profit >= 0 ? "text-emerald-600" : "text-rose-600"}>{money(st.profit)}（{st.margin.toFixed(1)}%）</b>} bold />
            <Row k="已收款 / 含稅總額" v={`${money(st.received)} / ${money(q.total)}`} />
          </div>
          <div>
            <div className="text-xs font-bold text-slate-600 mb-1">採購單（{st.purchases.length}）</div>
            {st.purchases.length === 0 && <div className="text-xs text-slate-400">無</div>}
            {st.purchases.map(p => <div key={p.id} className="flex justify-between text-sm border-b py-1"><span>{p.date}　{p.no}　{supName(p.supplierId)}</span><span>{money(p.subtotal)}</span></div>)}
          </div>
          <div>
            <div className="text-xs font-bold text-slate-600 mb-1">出工紀錄（{st.sheets.length}）</div>
            {st.sheets.length === 0 && <div className="text-xs text-slate-400">無</div>}
            {st.sheets.map(t => <div key={t.id} className="flex justify-between text-sm border-b py-1"><span>{t.date}　{empName(t.employeeId)}　{t.hours} 小時</span><span>{money(t.cost)}</span></div>)}
          </div>
          <div>
            <div className="text-xs font-bold text-slate-600 mb-1">其他支出（{st.otherTx.length}）</div>
            {st.otherTx.length === 0 && <div className="text-xs text-slate-400">無</div>}
            {st.otherTx.map(t => <div key={t.id} className="flex justify-between text-sm border-b py-1"><span>{t.date}　{t.category}　{t.note}</span><span>{money(t.amount)}</span></div>)}
          </div>
        </Modal>
      );
    }

    /* ===================== 客戶 / 供應商 ===================== */
    function PartyPage({ kind }) {
      const D = useData();
      const isCust = kind === "customers";
      const A = D.api[kind];
      const list = D[kind];
      const label = isCust ? "客戶" : "供應商";
      const [edit, setEdit] = useState(null);
      const [kw, setKw] = useState("");
      const rows = list.filter(c => !kw || [c.name, c.contact, c.phone, c.taxId].join(" ").toLowerCase().includes(kw.toLowerCase()));
      const save = data => {
        if (data.id) A.update(data.id, data); else A.add({ ...data, id: uid(isCust ? "c" : "s") });
        setEdit(null);
      };
      const del = c => {
        const used = isCust ? D.quotations.some(q => q.customerId === c.id) : D.purchases.some(p => p.supplierId === c.id);
        if (used) return alert(`此${label}已有${isCust ? "報價單" : "採購單"}紀錄，無法刪除。`);
        if (confirm(`確定刪除${label}「${c.name}」？`)) A.remove(c.id);
      };
      const columns = [
        { label: "公司名稱", render: c => <span className="font-bold text-slate-900">{c.name}</span> },
        { label: "統編", render: c => <span className="font-mono">{c.taxId || "-"}</span> },
        { label: "聯絡人", render: c => c.contact || "-" },
        { label: "電話", render: c => <span className="font-mono">{c.phone || "-"}</span> },
        { label: "Email", render: c => <span className="break-all">{c.email || "-"}</span> },
        { label: "地址", render: c => <span className="text-xs text-slate-500">{c.address || "-"}</span> },
        { label: "付款條件", render: c => c.paymentTerm || "-" },
        {
          label: "操作", align: "center", actions: true, render: c => (
            <div className="flex flex-wrap gap-2 justify-center">
              <ActBtn tone="slate" onClick={() => setEdit(c)}>編輯</ActBtn>
              <ActBtn tone="rose" onClick={() => del(c)}>刪除</ActBtn>
            </div>
          )
        }
      ];
      return (
        <div className="space-y-4 max-w-6xl">
          <PageHeader title={isCust ? "客戶與業主名冊" : "供應商名冊"} subtitle={`共 ${list.length} 筆`}>
            <SearchBox value={kw} onChange={setKw} />
            <button className={btnPrimary} onClick={() => setEdit("new")}><Icon name="plus" className="w-4 h-4" /> 新增{label}</button>
          </PageHeader>
          <DataList columns={columns} rows={rows} empty={`尚無${label}資料`} />
          {edit && <PartyForm title={edit === "new" ? `新增${label}` : `編輯${label}`} initial={edit === "new" ? {} : edit} onSave={save} onClose={() => setEdit(null)} />}
        </div>
      );
    }

      const supName = id => (D.suppliers.find(s => s.id === id) || {}).name || "-";
      const projName = id => (D.quotations.find(q => q.id === id) || {}).projectName || "";
      const rows = D.purchases.filter(p => !kw || [p.no, supName(p.supplierId), projName(p.projectId)].join(" ").toLowerCase().includes(kw.toLowerCase()));

      const save = data => {
        if (data.id) A.update(data.id, data);
        else A.add({ ...data, id: uid("po"), no: nextNo("PO", D.purchases), receiveStatus: "待收貨", payments: [] });
        setEdit(null);
      };

      // 同一材料多筆品項先合併，再一次更新庫存
      const adjustStock = (p, dir) => {
        const byProduct = {};
        (p.items || []).forEach(it => { if (it.productId) byProduct[it.productId] = (byProduct[it.productId] || 0) + num(it.quantity); });
        Object.keys(byProduct).forEach(pid => {
          const pr = D.products.find(x => x.id === pid);
          if (pr) D.api.products.update(pid, { stock: num(pr.stock) + dir * byProduct[pid] });
        });
      };
      const receive = (p, undo) => {
        const msg = undo ? `取消「${p.no}」的入庫？庫存會扣回。` : `確認「${p.no}」已收貨？對應材料的庫存會自動增加。`;
        if (!confirm(msg)) return;
        adjustStock(p, undo ? -1 : 1);
        A.update(p.id, { receiveStatus: undo ? "待收貨" : "已收貨", receivedDate: undo ? "" : today() });
      };
      const del = p => {
        const pays = paymentsOf(p);
        const received = p.receiveStatus === "已收貨";
        const msg = `確定刪除採購單「${p.no}」？`
          + (received ? "\n此單已入庫，庫存會一併扣回。" : "")
          + (pays.length ? `\n已登錄的 ${pays.length} 筆付款紀錄（含財務收支）也會一併刪除。` : "");
        if (!confirm(msg)) return;
        if (received) adjustStock(p, -1);
        D.transactions.filter(t => t.purchaseId === p.id).forEach(t => D.api.transactions.remove(t.id));
        A.remove(p.id);
      };
      const recordPayment = (p, { date, amount, note }) => {
        const txId = uid("t");
        D.api.transactions.add({
          id: txId, date, type: "expense", category: "材料採購款", amount,
          note: `${supName(p.supplierId)} (${p.no})${note ? " - " + note : ""}`,
          refNo: p.no, purchaseId: p.id, projectId: p.projectId || ""
        });
        A.update(p.id, { payments: [...paymentsOf(p), { id: uid("pm"), date, amount, note, txId }] });
        setPay(null);
      };

      const columns = [
        { label: "單號", render: p => <span className="font-mono font-bold text-blue-600">{p.no}</span> },
        { label: "日期", render: p => p.date },
        { label: "供應商", render: p => <span className="font-bold text-slate-900">{supName(p.supplierId)}</span> },
        { label: "歸屬工程", render: p => projName(p.projectId) || <span className="text-slate-300">-</span> },
        { label: "應付金額", align: "right", render: p => <b>{money(p.total)}</b> },
        {
          label: "收貨", render: p => <Badge cls={p.receiveStatus === "已收貨" ? "bg-emerald-100 text-emerald-800" : "bg-amber-100 text-amber-800"}>{p.receiveStatus || "待收貨"}</Badge>
        },
        {
          label: "付款", render: p => { const st = balanceStatus(p.total, sum(paymentsOf(p), x => x.amount), p.dueDate); return <Badge cls={st.cls}>{st.label}</Badge>; }
        },
        {
          label: "操作", align: "center", actions: true, render: p => {
            const received = p.receiveStatus === "已收貨";
            const bal = num(p.total) - sum(paymentsOf(p), x => x.amount);
            return (
              <div className="flex flex-wrap gap-2 justify-center">
                {received ? <ActBtn tone="slate" onClick={() => receive(p, true)}>取消入庫</ActBtn> : <ActBtn tone="emerald" onClick={() => receive(p, false)}>收貨入庫</ActBtn>}
                {bal > 0 && <ActBtn onClick={() => setPay(p)}>登錄付款</ActBtn>}
                {!received && <ActBtn tone="slate" onClick={() => setEdit(p)}>編輯</ActBtn>}
                <ActBtn tone="rose" onClick={() => del(p)}>刪除</ActBtn>
              </div>
            );
          }
        }
      ];
      return (
        <div className="space-y-4 max-w-6xl">
          <PageHeader title="採購單" subtitle="向供應商採購材料：收貨入庫會增加庫存，付款會同步記入財務收支">
            <SearchBox value={kw} onChange={setKw} placeholder="搜尋單號 / 供應商 / 工程" />
            <button className={btnPrimary} onClick={() => D.suppliers.length ? setEdit("new") : alert("請先到「供應商」新增至少一家供應商")}><Icon name="plus" className="w-4 h-4" /> 新增採購單</button>
          </PageHeader>
          <DataList columns={columns} rows={rows} empty="尚無採購單" />
          {edit && <PurchaseForm initial={edit === "new" ? {} : edit} onSave={save} onClose={() => setEdit(null)} />}
          {pay && <PaymentModal title={`登錄付款 - ${pay.no}`} balance={num(pay.total) - sum(paymentsOf(pay), x => x.amount)} onSave={d => recordPayment(pay, d)} onClose={() => setPay(null)} />}
        </div>
      );
    }

    /* ===================== 應收 / 應付 ===================== */
    function Ledger({ mode, rows, onPay, onDetail }) {
      const [flt, setFlt] = useState("open");
      const isAR = mode === "ar";
      const withSt = rows.map(r => ({ ...r, st: balanceStatus(r.total, r.paid, r.due) }));
      const totalAll = sum(withSt, r => r.total), paidAll = sum(withSt, r => r.paid);
      const overdue = withSt.filter(r => r.st.overdue);
      const shown = withSt.filter(r => flt === "all" ? true : flt === "open" ? r.st.balance > 0 : r.st.balance <= 0);
      const verb = isAR ? "收" : "付";
      const columns = [
        { label: "單號", render: r => <span className="font-mono font-bold text-blue-600">{r.no}</span> },
        { label: isAR ? "工程" : "歸屬工程", render: r => <span className="font-bold text-slate-900">{r.title}</span> },
        { label: isAR ? "業主" : "供應商", render: r => r.party },
        { label: "總額", align: "right", render: r => money(r.total) },
        { label: `已${verb}`, align: "right", render: r => <span className="text-emerald-600">{money(r.paid)}</span> },
        { label: `未${verb}`, align: "right", render: r => <b className={r.st.balance > 0 ? "text-rose-600" : "text-slate-400"}>{money(r.st.balance)}</b> },
        { label: `預計${verb}款日`, render: r => r.due || <span className="text-slate-300">-</span> },
        { label: "狀態", render: r => <Badge cls={r.st.cls}>{r.st.label}</Badge> },
        {
          label: "操作", align: "center", actions: true, render: r => (
            <div className="flex flex-wrap gap-2 justify-center">
              {r.st.balance > 0 && <ActBtn onClick={() => onPay(r)}>登錄{verb}款</ActBtn>}
              <ActBtn tone="slate" onClick={() => onDetail(r)}>{verb}款明細</ActBtn>
            </div>
          )
        }
      ];
      return (
        <div className="space-y-4 max-w-6xl">
          <PageHeader title={isAR ? "應收帳款" : "應付帳款"} subtitle={isAR ? "依「已成交」的報價單計算，收款會同步記入財務收支" : "依採購單計算，付款會同步記入財務收支"}>
            <Seg value={flt} onChange={setFlt} options={[{ value: "open", label: "未結清" }, { value: "done", label: "已結清" }, { value: "all", label: "全部" }]} />
          </PageHeader>
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
            <Stat label={isAR ? "應收總額" : "應付總額"} value={money(totalAll)} tone="blue" />
            <Stat label={`已${verb}`} value={money(paidAll)} tone="emerald" />
            <Stat label={`未${verb}餘額`} value={money(totalAll - paidAll)} tone="amber" />
            <Stat label="逾期" value={`${overdue.length} 筆`} tone={overdue.length ? "rose" : "slate"} sub={overdue.length ? money(sum(overdue, r => r.st.balance)) : "無逾期"} />
          </div>
          <DataList columns={columns} rows={shown} empty={flt === "open" ? "目前沒有未結清款項 🎉" : "沒有符合的資料"} />
        </div>
      );
    }

    function Receivables() {
      const D = useData();
      const [pay, setPay] = useState(null);
      const [hist, setHist] = useState(null);
      const rows = arRows(D);
      const getQ = id => D.quotations.find(x => x.id === id);
      const recordReceipt = (q, { date, amount, note }) => {
        const base = receiptsOf(q, D.transactions);
        const txId = uid("t");
        const cust = (D.customers.find(c => c.id === q.customerId) || {}).name || "";
        D.api.transactions.add({
          id: txId, date, type: "income", category: "工程款收入", amount,
          note: `${cust} (${q.no})${note ? " - " + note : ""}`, refNo: q.no, projectId: q.id
        });
        D.api.quotations.update(q.id, { receipts: [...base, { id: uid("r"), date, amount, note, txId }] });
        setPay(null);
      };
      const deleteReceipt = (q, rid) => {
        const base = receiptsOf(q, D.transactions);
        const r = base.find(x => x.id === rid);
        if (r && r.txId) D.api.transactions.remove(r.txId);
        D.api.quotations.update(q.id, { receipts: base.filter(x => x.id !== rid) });
      };
      const pq = pay && getQ(pay), hq = hist && getQ(hist);
      return (
        <>
          <Ledger mode="ar" rows={rows} onPay={r => setPay(r.id)} onDetail={r => setHist(r.id)} />
          {pq && <PaymentModal title={`登錄收款 - ${pq.no}`} balance={num(pq.total) - sum(receiptsOf(pq, D.transactions), r => r.amount)} onSave={d => recordReceipt(pq, d)} onClose={() => setPay(null)} />}
          {hq && <PaymentHistory title={`收款明細 - ${hq.no}`} entries={receiptsOf(hq, D.transactions)} onDelete={rid => deleteReceipt(hq, rid)} onClose={() => setHist(null)} />}
        </>
      );
    }

    function Payables() {
      const D = useData();
      const [pay, setPay] = useState(null);
      const [hist, setHist] = useState(null);
      const rows = apRows(D);
      const getP = id => D.purchases.find(x => x.id === id);
      const supName = id => (D.suppliers.find(s => s.id === id) || {}).name || "";
      const recordPayment = (p, { date, amount, note }) => {
        const txId = uid("t");
        D.api.transactions.add({
          id: txId, date, type: "expense", category: "材料採購款", amount,
          note: `${supName(p.supplierId)} (${p.no})${note ? " - " + note : ""}`, refNo: p.no, purchaseId: p.id, projectId: p.projectId || ""
        });
        D.api.purchases.update(p.id, { payments: [...paymentsOf(p), { id: uid("pm"), date, amount, note, txId }] });
        setPay(null);
      };
      const deletePayment = (p, pid) => {
        const base = paymentsOf(p);
        const r = base.find(x => x.id === pid);
        if (r && r.txId) D.api.transactions.remove(r.txId);
        D.api.purchases.update(p.id, { payments: base.filter(x => x.id !== pid) });
      };
      const pp = pay && getP(pay), hp = hist && getP(hist);
      return (
        <>
          <Ledger mode="ap" rows={rows} onPay={r => setPay(r.id)} onDetail={r => setHist(r.id)} />
          {pp && <PaymentModal title={`登錄付款 - ${pp.no}`} balance={num(pp.total) - sum(paymentsOf(pp), x => x.amount)} onSave={d => recordPayment(pp, d)} onClose={() => setPay(null)} />}
          {hp && <PaymentHistory title={`付款明細 - ${hp.no}`} entries={paymentsOf(hp)} onDelete={pid => deletePayment(hp, pid)} onClose={() => setHist(null)} />}
        </>
      );
    }

    /* ===================== 財務收支 ===================== */
    function Finance() {
      const D = useData();
      const [adding, setAdding] = useState(false);
      const [month, setMonth] = useState("all");
      const months = Array.from(new Set([today().slice(0, 7), ...D.transactions.map(t => monthOf(t.date))])).filter(Boolean).sort().reverse();
      const linked = useMemo(() => new Set(D.quotations.flatMap(q => receiptsOf(q, D.transactions).map(r => r.txId))), [D.quotations, D.transactions]);
      const list = D.transactions.filter(t => month === "all" || monthOf(t.date) === month).slice().sort((a, b) => (b.date || "").localeCompare(a.date || ""));
      const inc = sum(list.filter(t => t.type === "income"), t => t.amount);
      const exp = sum(list.filter(t => t.type === "expense"), t => t.amount);
      const projName = id => (D.quotations.find(q => q.id === id) || {}).projectName || "";
      const isLinked = t => linked.has(t.id) || !!t.purchaseId || t.kind === "payroll";
      const del = t => {
        if (isLinked(t)) return alert("這筆是由「應收 / 應付 / 薪資」連動產生的，請到對應頁面刪除或取消，帳務才會一致。");
        if (confirm("確定刪除這筆收支？")) D.api.transactions.remove(t.id);
      };
      const columns = [
        { label: "日期", render: t => <span className="text-slate-500">{t.date}</span> },
        { label: "類型", render: t => <Badge cls={t.type === "income" ? "bg-emerald-100 text-emerald-800" : "bg-rose-100 text-rose-800"}>{t.type === "income" ? "收入" : "支出"}</Badge> },
        { label: "分類", render: t => <span className="font-medium">{t.category}{isLinked(t) && <span className="ml-1 text-[10px] text-slate-400">（連動）</span>}</span> },
        { label: "說明", render: t => <span className="text-slate-600 break-words">{t.note}</span> },
        { label: "歸屬工程", render: t => projName(t.projectId) || <span className="text-slate-300">-</span> },
        { label: "金額", align: "right", render: t => <b className={t.type === "income" ? "text-emerald-600" : "text-rose-600"}>{t.type === "income" ? "+" : "-"} {money(t.amount)}</b> },
        { label: "操作", align: "center", actions: true, render: t => <ActBtn tone="rose" onClick={() => del(t)}>刪除</ActBtn> }
      ];
      return (
        <div className="space-y-4 max-w-6xl">
          <PageHeader title="財務收支" subtitle="收款、付款、薪資會自動記入；其他雜支可手動記帳">
            <select className={inputCls + " !w-auto"} value={month} onChange={e => setMonth(e.target.value)}>
              <option value="all">全部期間</option>
              {months.map(m => <option key={m} value={m}>{m}</option>)}
            </select>
            <button className={btnPrimary} onClick={() => setAdding(true)}><Icon name="plus" className="w-4 h-4" /> 手動記帳</button>
          </PageHeader>
          <div className="grid grid-cols-3 gap-3">
            <Stat label="收入" value={money(inc)} tone="emerald" />
            <Stat label="支出" value={money(exp)} tone="rose" />
            <Stat label="淨額" value={money(inc - exp)} tone={inc - exp >= 0 ? "blue" : "rose"} />
          </div>
          <DataList columns={columns} rows={list} empty="這個期間沒有收支紀錄" />
          {adding && <TransactionForm onSave={t => { D.api.transactions.add(t); setAdding(false); }} onClose={() => setAdding(false)} />}
        </div>
      );
    }

    /* ===================== 員工 ===================== */
    function Employees() {
      const D = useData();
      const A = D.api.employees;
      const [edit, setEdit] = useState(null);
      const save = data => {
        if (data.id) A.update(data.id, data); else A.add({ ...data, id: uid("e") });
        setEdit(null);
      };
      const del = e => {
        if (D.timesheets.some(t => t.employeeId === e.id)) return alert("此員工已有出工紀錄，無法刪除。請改為「離職」狀態保留歷史資料。");
        if (confirm(`確定刪除員工「${e.name}」？`)) A.remove(e.id);
      };
      const columns = [
        { label: "姓名", render: e => <span className="font-bold text-slate-900">{e.name}</span> },
        { label: "職稱", render: e => e.title || "-" },
        { label: "電話", render: e => <span className="font-mono">{e.phone || "-"}</span> },
        { label: "計薪方式", render: e => e.payType },
        { label: "薪資基準", align: "right", render: e => money(e.rate) },
        { label: "換算時薪", align: "right", render: e => <span className="text-slate-500">{money(hourlyOf(e))}</span> },
        { label: "狀態", render: e => <Badge cls={e.active === false ? "bg-slate-200 text-slate-600" : "bg-emerald-100 text-emerald-800"}>{e.active === false ? "離職" : "在職"}</Badge> },
        {
          label: "操作", align: "center", actions: true, render: e => (
            <div className="flex flex-wrap gap-2 justify-center">
              <ActBtn tone="slate" onClick={() => setEdit(e)}>編輯</ActBtn>
              <ActBtn tone="rose" onClick={() => del(e)}>刪除</ActBtn>
            </div>
          )
        }
      ];
      return (
        <div className="space-y-4 max-w-6xl">
          <PageHeader title="員工名冊" subtitle={`在職 ${D.employees.filter(e => e.active !== false).length} 人`}>
            <button className={btnPrimary} onClick={() => setEdit("new")}><Icon name="plus" className="w-4 h-4" /> 新增員工</button>
          </PageHeader>
          <DataList columns={columns} rows={D.employees} empty="尚無員工資料，點右上角新增" />
          {edit && <EmployeeForm initial={edit === "new" ? {} : edit} onSave={save} onClose={() => setEdit(null)} />}
        </div>
      );
    }

    /* ===================== 工時與薪資 ===================== */
    function Timesheets() {
      const D = useData();
      const [view, setView] = useState("sheets");
      const [month, setMonth] = useState(today().slice(0, 7));
      const [adding, setAdding] = useState(false);
      const [payroll, setPayroll] = useState(null);
      const empName = id => (D.employees.find(e => e.id === id) || {}).name || "（已刪除）";
      const projName = id => (D.quotations.find(q => q.id === id) || {}).projectName || "";
      const monthSheets = D.timesheets.filter(t => monthOf(t.date) === month);
      const sheetRows = monthSheets.slice().sort((a, b) => (b.date || "").localeCompare(a.date || ""));

      const addSheets = list => { list.forEach(t => D.api.timesheets.add(t)); setAdding(false); };

      const sheetCols = [
        { label: "日期", render: t => t.date },
        { label: "員工", render: t => <span className="font-bold text-slate-900">{empName(t.employeeId)}</span> },
        { label: "工程", render: t => projName(t.projectId) || <span className="text-slate-400">公司內務</span> },
        { label: "工時", align: "right", render: t => `${num(t.hours)} 小時` },
        { label: "人工成本", align: "right", render: t => money(t.cost) },
        { label: "備註", render: t => <span className="text-slate-500">{t.note}</span> },
        { label: "操作", align: "center", actions: true, render: t => <ActBtn tone="rose" onClick={() => { if (confirm("確定刪除這筆出工紀錄？")) D.api.timesheets.remove(t.id); }}>刪除</ActBtn> }
      ];

      // 薪資結算
      const payRows = D.employees
        .map(e => {
          const mine = monthSheets.filter(t => t.employeeId === e.id);
          const hours = sum(mine, t => t.hours);
          const amount = e.payType === "月薪" ? num(e.rate) : sum(mine, t => t.cost);
          const key = `${month}_${e.id}`;
          const tx = D.transactions.find(t => t.kind === "payroll" && t.payrollKey === key);
          return { id: e.id, e, hours, amount, key, tx, show: e.active !== false || hours > 0 };
        })
        .filter(r => r.show && (r.amount > 0 || r.hours > 0 || r.tx));
      const totalDue = sum(payRows, r => r.amount);
      const totalPaid = sum(payRows, r => r.tx ? r.tx.amount : 0);

      const pay = (r, { date, amount, note }) => {
        D.api.transactions.add({
          id: uid("t"), date, type: "expense", category: "薪資支出", amount,
          note: `${month} ${r.e.name} 薪資${note ? " - " + note : ""}`, refNo: "", kind: "payroll", payrollKey: r.key
        });
        setPayroll(null);
      };
      const payCols = [
        { label: "員工", render: r => <span className="font-bold text-slate-900">{r.e.name}{r.e.active === false && <span className="text-xs text-slate-400">（離職）</span>}</span> },
        { label: "計薪方式", render: r => `${r.e.payType} ${money(r.e.rate)}` },
        { label: "出工時數", align: "right", render: r => `${r.hours} 小時` },
        { label: "出工天數", align: "right", render: r => `${(r.hours / 8).toFixed(1)} 天` },
        { label: "應發薪資", align: "right", render: r => <b>{money(r.amount)}</b> },
        { label: "狀態", render: r => r.tx ? <Badge cls="bg-emerald-100 text-emerald-800">已發放 {r.tx.date}（{money(r.tx.amount)}）</Badge> : <Badge cls="bg-amber-100 text-amber-800">未發放</Badge> },
        {
          label: "操作", align: "center", actions: true, render: r => r.tx
            ? <ActBtn tone="slate" onClick={() => { if (confirm("取消發放？對應的財務支出會一併刪除。")) D.api.transactions.remove(r.tx.id); }}>取消發放</ActBtn>
            : <ActBtn onClick={() => setPayroll(r)}>發放薪資</ActBtn>
        }
      ];

      return (
        <div className="space-y-4 max-w-6xl">
          <PageHeader title="工時與薪資" subtitle="出工紀錄會自動計入各工程的人工成本">
            <input type="month" className={inputCls + " !w-auto"} value={month} onChange={e => setMonth(e.target.value)} />
            {view === "sheets" && <button className={btnPrimary} onClick={() => D.employees.length ? setAdding(true) : alert("請先到「員工名冊」新增員工")}><Icon name="plus" className="w-4 h-4" /> 新增出工登記</button>}
          </PageHeader>
          <Seg value={view} onChange={setView} options={[{ value: "sheets", label: "出工紀錄" }, { value: "payroll", label: "薪資結算" }]} />
          {view === "sheets" ? (
            <>
              <div className="grid grid-cols-2 gap-3">
                <Stat label="本月總工時" value={`${sum(monthSheets, t => t.hours)} 小時`} sub={`約 ${(sum(monthSheets, t => t.hours) / 8).toFixed(1)} 人天`} tone="blue" />
                <Stat label="本月人工成本" value={money(sum(monthSheets, t => t.cost))} tone="amber" />
              </div>
              <DataList columns={sheetCols} rows={sheetRows} empty="這個月還沒有出工紀錄" />
            </>
          ) : (
            <>
              <div className="grid grid-cols-2 gap-3">
                <Stat label="本月應發薪資" value={money(totalDue)} tone="blue" />
                <Stat label="已發放" value={money(totalPaid)} tone="emerald" />
              </div>
              <div className="text-xs text-slate-500">日薪 / 時薪依出工時數計算；月薪固定發放月薪金額。</div>
              <DataList columns={payCols} rows={payRows} empty="這個月沒有需要結算的薪資" />
            </>
          )}
          {adding && <TimesheetForm onSave={addSheets} onClose={() => setAdding(false)} />}
          {payroll && <PayrollModal emp={payroll.e} month={month} suggested={payroll.amount} onSave={d => pay(payroll, d)} onClose={() => setPayroll(null)} />}
        </div>
      );
    }

    /* ===================== 設定 ===================== */
    function Settings({ onLock, connectCloud }) {
      const D = useData();
      const [d, setD] = useState(D.company);
      const [fb, setFb] = useState(D.fbConfigStr);
      const fileRef = useRef(null);
      useEffect(() => { setD(D.company); }, [D.company]);
      const set = k => e => setD(p => ({ ...p, [k]: e.target.value }));

      const saveCompany = () => { D.saveCompany({ ...d, name: d.name.trim() || "我的公司" }); alert("公司資料已儲存"); };

      const exportAll = () => {
        const payload = { app: "changxing-erp", exportedAt: new Date().toISOString(), company: D.company };
        ["customers", "suppliers", "products", "quotations", "purchases", "employees", "timesheets", "transactions"].forEach(k => { payload[k] = D[k]; });
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `長興ERP備份_${today()}.json`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      };
      const importAll = e => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async () => {
          try {
            const p = JSON.parse(reader.result);
            if (p.app !== "changxing-erp") throw new Error("這不是本系統的備份檔");
            if (!confirm("匯入會「覆蓋」目前所有資料（若已連雲端，雲端也會被覆蓋）。確定繼續？")) return;
            for (const k of ["customers", "suppliers", "products", "quotations", "purchases", "employees", "timesheets", "transactions"]) {
              if (Array.isArray(p[k])) await D.api[k].replaceAll(p[k]);
            }
            if (p.company) D.saveCompany({ ...D.company, ...p.company });
            alert("匯入完成");
          } catch (err) { alert("匯入失敗：" + err.message); }
        };
        reader.readAsText(file);
        e.target.value = "";
      };

      return (
        <div className="space-y-4 max-w-4xl">
          <PageHeader title="公司設定 / 雲端同步" subtitle="這些資料會顯示在報價單抬頭與匯款資訊" />
          <div className="bg-white p-4 sm:p-6 rounded-xl border border-slate-200 space-y-4 shadow-sm">
            <h3 className="font-bold text-slate-800 text-sm">公司基本資料</h3>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <Field label="廠商名稱（抬頭）"><input className={inputCls + " font-bold"} value={d.name || ""} onChange={set("name")} /></Field>
              <Field label="統一編號"><input className={inputCls} inputMode="numeric" value={d.taxId || ""} onChange={set("taxId")} /></Field>
              <Field label="負責人 / 聯絡人"><input className={inputCls} value={d.contact || ""} onChange={set("contact")} /></Field>
              <Field label="聯絡電話"><input className={inputCls} inputMode="tel" value={d.phone || ""} onChange={set("phone")} /></Field>
              <Field label="Email"><input type="email" className={inputCls} value={d.email || ""} onChange={set("email")} /></Field>
              <Field label="營業地址"><input className={inputCls} value={d.address || ""} onChange={set("address")} /></Field>
              <Field label="匯款銀行"><input className={inputCls} value={d.bankName || ""} onChange={set("bankName")} /></Field>
              <Field label="匯款帳號"><input className={inputCls} inputMode="numeric" value={d.bankAccount || ""} onChange={set("bankAccount")} /></Field>
              <Field label="戶名" className="sm:col-span-2"><input className={inputCls} value={d.bankOwner || ""} onChange={set("bankOwner")} /></Field>
            </div>
            <hr />
            <h3 className="font-bold text-slate-800 text-sm">系統登入密碼</h3>
            <Field label="登入密碼" hint="清空代表不需要密碼。這是方便的簡易鎖，不能取代雲端權限設定。">
              <input className={inputCls + " font-mono"} value={d.password || ""} onChange={set("password")} />
            </Field>
            <button className={btnPrimary} onClick={saveCompany}>儲存公司資料與密碼</button>
          </div>

          <div className="bg-white p-4 sm:p-6 rounded-xl border border-slate-200 space-y-3 shadow-sm">
            <h3 className="font-bold text-slate-800 text-sm">Google Firebase 雲端同步</h3>
            <div className="text-sm">目前狀態：<b>{D.cloud.text}</b></div>
            <textarea rows="6" className={inputCls + " font-mono !text-xs"} placeholder={'貼上 Firebase 設定，例如：\n{ "apiKey": "...", "authDomain": "...", "projectId": "...", ... }\n（直接貼 Firebase 主控台的 firebaseConfig 也可以）\n留空 = 只存在這台裝置'} value={fb} onChange={e => setFb(e.target.value)} />
            <div className="text-xs text-slate-500 space-y-1">
              <div>1. 到 Firebase 主控台建立專案，並啟用 Firestore Database。</div>
              <div>2. 專案設定 → 加入網頁應用程式，複製 firebaseConfig 貼到上方。</div>
              <div>3. Firestore 規則需允許讀寫，否則會顯示「權限不足」。</div>
              <div>首次連線時，若雲端是空的，會自動把這台裝置的資料上傳；之後所有裝置共用同一份資料。</div>
            </div>
            <div className="flex flex-wrap gap-2">
              <button className={btnPrimary} onClick={() => connectCloud(fb)}>儲存並連接雲端</button>
              {D.fbConfigStr && <button className={btnGhost} onClick={() => { if (confirm("中斷雲端連線？資料仍保留在這台裝置。")) connectCloud(""); }}>中斷連線</button>}
            </div>
          </div>

          <div className="bg-white p-4 sm:p-6 rounded-xl border border-slate-200 space-y-3 shadow-sm">
            <h3 className="font-bold text-slate-800 text-sm">備份與還原</h3>
            <div className="text-xs text-slate-500">建議定期備份。備份檔包含所有報價、客戶、採購、員工與帳務資料。</div>
            <div className="flex flex-wrap gap-2">
              <button className={btnGhost} onClick={exportAll}><Icon name="download" className="w-4 h-4" /> 匯出備份</button>
              <button className={btnGhost} onClick={() => fileRef.current && fileRef.current.click()}><Icon name="upload" className="w-4 h-4" /> 匯入備份</button>
              <input ref={fileRef} type="file" accept="application/json,.json" className="hidden" onChange={importAll} />
              {D.company.password && <button className={btnGhost} onClick={onLock}><Icon name="lock" className="w-4 h-4" /> 立即鎖定</button>}
            </div>
          </div>
        </div>
      );
    }

    /* ===================== 登入畫面 ===================== */
    function LoginScreen({ company, onUnlock }) {
      const [pw, setPw] = useState("");
      const submit = () => { if (pw === company.password) onUnlock(); else alert("密碼錯誤，請重新輸入！"); };
      return (
        <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl p-8 max-w-md w-full shadow-2xl space-y-6 text-center">
            <div className="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto"><Icon name="lock" /></div>
            <div>
              <h1 className="text-2xl font-bold text-slate-900">{company.name}</h1>
              <p className="text-slate-500 text-sm mt-1">ERP 管理系統 - 請輸入登入密碼</p>
              {company.password === "123" && <p className="text-xs text-amber-600 mt-2">目前是預設密碼 123，登入後請到「公司設定」修改。</p>}
            </div>
            <div className="space-y-4">
              <input type="password" placeholder="輸入登入密碼" value={pw} autoFocus
                onChange={e => setPw(e.target.value)} onKeyDown={e => e.key === "Enter" && submit()}
                className="w-full border rounded-xl p-3 text-center text-lg outline-none focus:ring-2 ring-blue-500 bg-slate-50" />
              <button onClick={submit} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow transition">解鎖進入系統</button>
            </div>
          </div>
        </div>
      );
    }

    /* ===================== 主程式 ===================== */
    function App() {
      const [fbConfigStr] = useState(() => localStorage.getItem("firebase_config") || "");
      const [db, setDb] = useState(null);
      const [cloud, setCloud] = useState({ ok: false, text: "本機模式（資料只存在這台裝置）" });

      useEffect(() => {
        if (!fbConfigStr.trim()) return;
        try {
          if (typeof firebase === "undefined") throw new Error("Firebase 元件載入失敗，請檢查網路");
          const cfg = parseFirebaseConfig(fbConfigStr);
          if (!cfg.projectId) throw new Error("設定中缺少 projectId");
          if (!firebase.apps.length) firebase.initializeApp(cfg);
          setDb(firebase.firestore());
          setCloud({ ok: true, text: "🟢 雲端同步中" });
        } catch (e) {
          setCloud({ ok: false, text: "🔴 Firebase 設定有誤：" + e.message });
        }
      }, []);

      useEffect(() => {
        const h = e => setCloud({ ok: false, text: e.detail === "permission-denied" ? "🔴 雲端權限不足，請檢查 Firestore 規則" : "🔴 雲端連線錯誤（" + e.detail + "）" });
        window.addEventListener("cloud-error", h);
        return () => window.removeEventListener("cloud-error", h);
      }, []);

      const [company, saveCompany] = useCloudDoc("company", defaultCompany, db);
      const [customers, customersApi] = useCloudList("customers", initialCustomers, db);
      const [suppliers, suppliersApi] = useCloudList("suppliers", [], db);
      const [products, productsApi] = useCloudList("products", initialProducts, db);
      const [quotations, quotationsApi] = useCloudList("quotations", initialQuotations, db);
      const [purchases, purchasesApi] = useCloudList("purchases", [], db);
      const [employees, employeesApi] = useCloudList("employees", [], db);
      const [timesheets, timesheetsApi] = useCloudList("timesheets", [], db);
      const [transactions, transactionsApi] = useCloudList("transactions", initialTransactions, db);

      const [unlocked, setUnlocked] = useState(() => { try { return sessionStorage.getItem("erp_unlocked") === "1"; } catch (e) { return false; } });
      const [tab, setTab] = useState(() => {
        const h = (location.hash || "").replace("#", "");
        return NAV_FLAT.some(n => n.id === h) ? h : "dashboard";
      });
      const [navOpen, setNavOpen] = useState(false);
      const [previewId, setPreviewId] = useState(null);
      const mainRef = useRef(null);

      const go = t => {
        setTab(t); setNavOpen(false);
        try { history.replaceState(null, "", "#" + t); } catch (e) { /* ignore */ }
      };
      useEffect(() => { if (mainRef.current) mainRef.current.scrollTop = 0; }, [tab]);
      useEffect(() => {
        const h = () => { if (window.innerWidth >= 768) setNavOpen(false); };
        window.addEventListener("resize", h);
        return () => window.removeEventListener("resize", h);
      }, []);

      const unlock = () => { try { sessionStorage.setItem("erp_unlocked", "1"); } catch (e) { /* ignore */ } setUnlocked(true); };
      const lock = () => { try { sessionStorage.removeItem("erp_unlocked"); } catch (e) { /* ignore */ } setUnlocked(false); };

      const connectCloud = str => {
        try {
          if (str.trim()) { const c = parseFirebaseConfig(str); if (!c.projectId) throw new Error("設定中缺少 projectId"); }
        } catch (e) { alert("Firebase 設定格式有誤：" + e.message); return; }
        localStorage.setItem("firebase_config", str.trim());
        location.reload();
      };

      const D = {
        company, saveCompany, customers, suppliers, products, quotations, purchases, employees, timesheets, transactions,
        fbConfigStr, cloud,
        api: {
          customers: customersApi, suppliers: suppliersApi, products: productsApi, quotations: quotationsApi,
          purchases: purchasesApi, employees: employeesApi, timesheets: timesheetsApi, transactions: transactionsApi
        }
      };

      if (company.password && !unlocked) return <LoginScreen company={company} onUnlock={unlock} />;

      const pages = {
        dashboard: <Dashboard go={go} />,
        quotations: <Quotations onPreview={setPreviewId} />,
        projects: <Projects />,
        customers: <PartyPage kind="customers" />,
        suppliers: <PartyPage kind="suppliers" />,
        purchases: <Purchases />,
        products: <Products />,
        receivables: <Receivables />,
        payables: <Payables />,
        finance: <Finance />,
        employees: <Employees />,
        timesheets: <Timesheets />,
        settings: <Settings onLock={lock} connectCloud={connectCloud} />
      };
      const current = NAV_FLAT.find(n => n.id === tab) || NAV_FLAT[0];

      return (
        <DataCtx.Provider value={D}>
          <div className="flex overflow-hidden relative h-screen" style={{ height: "100dvh" }}>
            {navOpen && <div onClick={() => setNavOpen(false)} className="fixed inset-0 bg-black/50 z-30 md:hidden no-print"></div>}

            <aside className={`fixed md:static inset-y-0 left-0 z-40 w-72 md:w-60 shrink-0 bg-slate-900 text-slate-200 flex flex-col p-3 no-print transform transition-transform duration-200 ease-in-out ${navOpen ? "translate-x-0" : "-translate-x-full"} md:translate-x-0`}>
              <div className="flex items-center justify-between gap-3 px-2 py-3 border-b border-slate-800 shrink-0">
                <div className="flex items-center gap-3 min-w-0">
                  <div className="w-9 h-9 rounded bg-blue-600 font-bold flex items-center justify-center text-white text-xs shrink-0">長興</div>
                  <div className="min-w-0">
                    <div className="font-bold text-base text-white truncate">{company.name}</div>
                    <div className="text-[10px] text-slate-400 mt-0.5 break-words leading-tight">{cloud.text}</div>
                  </div>
                </div>
                <button onClick={() => setNavOpen(false)} className="md:hidden text-slate-400 hover:text-white p-1 shrink-0"><Icon name="x" /></button>
              </div>

              <nav className="mt-3 flex-1 min-h-0 overflow-y-auto space-y-4 pr-1">
                {NAV.map(g => (
                  <div key={g.group}>
                    <div className="px-3 mb-1 text-[11px] font-bold tracking-wider text-slate-500">{g.group}</div>
                    <div className="space-y-0.5">
                      {g.items.map(n => (
                        <button key={n.id} type="button" onClick={() => go(n.id)}
                          className={`relative z-10 w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition select-none text-left ${tab === n.id ? "bg-blue-600 text-white shadow" : "text-slate-400 hover:bg-slate-800 hover:text-white"}`}>
                          <Icon name={n.icon} className="w-5 h-5 shrink-0" />
                          <span className="leading-tight">{n.label}</span>
                        </button>
                      ))}
                    </div>
                  </div>
                ))}
              </nav>

              {company.password && (
                <div className="shrink-0 pt-2">
                  <button onClick={lock} className="w-full text-xs text-slate-400 hover:text-rose-400 p-2 text-center border border-slate-800 rounded">🔒 鎖定系統</button>
                </div>
              )}
            </aside>

            <main ref={mainRef} className="flex-1 min-w-0 overflow-y-auto p-4 sm:p-6 lg:p-8 no-print">
              <div className="flex items-center gap-3 mb-4 md:hidden">
                <button onClick={() => setNavOpen(true)} className="p-2 rounded-lg bg-slate-900 text-white shadow shrink-0"><Icon name="menu" /></button>
                <span className="font-bold text-slate-800 truncate">{current.label}</span>
              </div>
              {pages[tab]}
            </main>

            {previewId && <QuotePreview qid={previewId} onClose={() => setPreviewId(null)} />}
          </div>
        </DataCtx.Provider>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
</body>
</html>
